plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pikminpilot.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pikminpilot.android'
        minSdk 30
        targetSdk 36
        versionCode 16
        versionName '0.3.5-alpha17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android counterpart of the iOS Vision OCR used by FruitDetector.swift.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
